<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#020617" />
  <title>GlobalPulse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="styles.css" />
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="flex items-center w-full max-w-md mx-auto mb-3">
      <div class="flex items-center gap-2">
        <div class="flex h-8 w-8 items-center justify-center rounded-full bg-red-600/20 border border-red-500/40 text-red-400" aria-hidden="true">
          <i class="fa-solid fa-bolt text-sm"></i>
        </div>
        <div class="brand text-lg font-black tracking-[0.18em] text-white">GLOBAL<span class="text-red-400">PULSE</span></div>
      </div>
    </div>
    <nav id="category-bar" class="chip-row flex w-full max-w-md mx-auto gap-2 pb-1" aria-label="Categorias"></nav>
  </header>
  <main id="feed-container" class="feed-container" aria-live="polite" aria-busy="false"></main>
  <div id="loader" class="loader hidden" role="status" aria-live="polite" aria-hidden="true">
    <i class="fa-solid fa-circle-notch fa-spin text-red-400" aria-hidden="true"></i>
    <span>Gerando 3 novidades com Gemini...</span>
  </div>
</body>
</html>

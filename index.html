<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>GlobalPulse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root {
      --bg: #020617;
      --card: rgba(15, 23, 42, 0.75);
      --muted: rgba(148, 163, 184, 0.9);
      --line: rgba(255, 255, 255, 0.08);
      --accent: #ef4444;
      --accent-2: #a78bfa;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: white;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(circle at top, rgba(99, 102, 241, 0.18), transparent 22%),
        radial-gradient(circle at bottom right, rgba(239, 68, 68, 0.12), transparent 28%),
        #020617;
    }

    .feed-container {
      height: 100dvh;
      width: 100vw;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .feed-container::-webkit-scrollbar { display: none; }

    .card-snap {
      position: relative;
      width: 100vw;
      height: 100dvh;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: flex-end;
      padding: 1.1rem 1rem 1.2rem 1rem;
    }

    .card-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(1.05) contrast(1.08);
      transform: scale(1.05);
    }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,0.18) 0%,
        rgba(0,0,0,0.12) 28%,
        rgba(0,0,0,0.42) 60%,
        rgba(0,0,0,0.82) 100%
      );
    }

    .text-shadow {
      text-shadow: 0 8px 24px rgba(0,0,0,0.55);
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 40;
      padding: 1rem 1rem 0.7rem;
      pointer-events: auto;
      background: linear-gradient(to bottom, rgba(2, 6, 23, 0.8), rgba(2, 6, 23, 0.15), transparent);
      backdrop-filter: blur(3px);
    }

    .brand { letter-spacing: 0.12em; }

    .chip-row {
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 0.12rem;
    }

    .chip-row::-webkit-scrollbar { display: none; }

    .cat-btn {
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: rgba(226,232,240,0.9);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .cat-btn.active {
      background: linear-gradient(135deg, #ef4444, #f97316);
      border-color: rgba(255,255,255,0.2);
      color: white;
      box-shadow: 0 10px 24px rgba(239, 68, 68, 0.33);
    }

    .action-btn {
      width: 3.1rem;
      height: 3.1rem;
      border-radius: 9999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      transition: transform 0.18s ease, border-color 0.2s ease;
    }

    .action-btn:active {
      transform: scale(0.94);
    }

    .action-btn.active {
      border-color: rgba(239,68,68,0.7);
      background: rgba(127,29,29,0.18);
    }

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 2rem 1.5rem;
      text-align: center;
      color: rgba(203, 213, 225, 0.9);
    }

    .loader {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 1rem 0 1.5rem;
      color: rgba(148,163,184,0.95);
      background: rgba(2,6,23,0.7);
      font-size: 0.8rem;
    }

    @media (min-width: 640px) {
      .card-snap { padding: 1.25rem 1.5rem 1.5rem; }
      .topbar { padding-left: 1.5rem; padding-right: 1.5rem; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="flex items-center justify-between w-full max-w-md mx-auto mb-3">
      <div class="flex items-center gap-2">
        <div class="flex h-8 w-8 items-center justify-center rounded-full bg-red-600/20 border border-red-500/40 text-red-400">
          <i class="fa-solid fa-bolt text-sm"></i>
        </div>
        <div class="brand text-lg font-black tracking-[0.18em] text-white">
          GLOBAL<span class="text-red-400">PULSE</span>
        </div>
      </div>
    </div>

    <nav id="category-bar" class="chip-row flex w-full max-w-md mx-auto gap-2 pb-1"></nav>
  </header>

  <main id="feed-container" class="feed-container" aria-live="polite"></main>

  <div id="loader" class="loader hidden">
    <i class="fa-solid fa-circle-notch fa-spin text-red-400"></i>
    <span>Buscando novidades...</span>
  </div>

  <script>
    const CURRENTS_API_KEY = 'sI4_MxTyZXaZZCfOE2yCfVUVssmI6BiCttH4b1wEQc7Mk_86';
    const DEFAULT_BG = 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?auto=format&fit=crop&w=1400&q=80';

    const categories = [
      { id: 'all', label: 'Para você' },
      { id: 'news', label: 'Notícias' },
      { id: 'tech', label: 'Tech' },
      { id: 'history', label: 'História' },
      { id: 'science', label: 'Ciência' },
      { id: 'culture', label: 'Cultura' },
      { id: 'health', label: 'Saúde' },
      { id: 'environment', label: 'Ambiente' }
    ];

    const fallbackDatabase = {
      news: [
        { title: 'Nova onda de energia limpa desafia mercado global', text: 'Investidores e cidades aceleram uso de tecnologias mais leves e eficientes para reduzir perdas e aumentar capacidade de produção.', tag: 'NOTÍCIAS', image: 'https://images.unsplash.com/photo-1497435334941-8c899ee9e8e9?auto=format&fit=crop&w=1200&q=80' },
        { title: 'Mobilidade urbana cresce com novas rotas inteligentes', text: 'Sistemas de tráfego em tempo real ajudam cidades a reduzirem congestionamentos e a melhorarem tempo de deslocamento.', tag: 'NOTÍCIAS', image: 'https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=1200&q=80' },
        { title: 'Educação digital cresce com ferramentas de aprendizagem', text: 'Plataformas e conteúdos em menor formato ajudam estudantes a aprenderem de maneira mais direta e prática.', tag: 'NOTÍCIAS', image: 'https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1200&q=80' }
      ],
      tech: [
        { title: 'Computação quântica entra em fase de testes reais', text: 'Pesquisadores trabalham para reduzir erros e ampliar a capacidade de processamento em problemas complexos.', tag: 'TECH', image: 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1200&q=80' },
        { title: 'IA melhora análise de imagens e diagnósticos', text: 'Modelos inteligentes ajudam a encontrar padrões mais rapidamente em grandes volumes de dados e imagens.', tag: 'TECH', image: 'https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=1200&q=80' },
        { title: 'Dispositivos mais leves mudam rotina digital', text: 'Hardware enxuto e maior autonomia estão redefinindo como as pessoas acessam conteúdos e trabalham no dia a dia.', tag: 'TECH', image: 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=80' }
      ],
      history: [
        { title: 'Civilizações antigas usavam engenharia avançada', text: 'Estruturas antigas ainda impressionam pela precisão e pela lógica matemática presente na construção e planejamento.', tag: 'HISTÓRIA', image: 'https://images.unsplash.com/photo-1503177119275-0aa32b3a9368?auto=format&fit=crop&w=1200&q=80' },
        { title: 'O mundo antigo guardava saberes surpreendentes', text: 'Bibliotecas, observatórios e estudos astronômicos revelam a curiosidade de civilizações que marcaram a história.', tag: 'HISTÓRIA', image: 'https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=1200&q=80' },
        { title: 'A ciência em tempos de grandes descobertas', text: 'Inventos e teorias de séculos atrás continuam influenciando a forma como entendemos o mundo e a tecnologia.', tag: 'HISTÓRIA', image: 'https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?auto=format&fit=crop&w=1200&q=80' }
      ],
      science: [
        { title: 'O cérebro reconhece padrões em frações de segundo', text: 'Essa velocidade de percepção ajuda a processar informações, antecipar riscos e tomar decisões rápidas.', tag: 'CIÊNCIA', image: 'https://images.unsplash.com/photo-1532187643603-ba119ca4109e?auto=format&fit=crop&w=1200&q=80' },
        { title: 'A física da água mostra energia em movimento', text: 'Desde pequenos fluxos até grandes cachoeiras, o comportamento da água revela leis fundamentais da natureza.', tag: 'CIÊNCIA', image: 'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=80' },
        { title: 'Exploração do espaço continua surpreendendo', text: 'Missões atuais ampliam entendimento sobre planetas, luas e sinais de vida em outros mundos.', tag: 'CIÊNCIA', image: 'https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=1200&q=80' }
      ],
      culture: [
        { title: 'Arte urbana vira linguagem global', text: 'Pessoas em cidades do mundo usam muralismo, fotografia e música para contar histórias locais e universais.', tag: 'CULTURA', image: 'https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=1200&q=80' },
        { title: 'A música continua transformando a forma de aprender', text: 'Ritmo, memória e atenção trabalham juntos, mostrando como sons podem reforçar conhecimento e emoções.', tag: 'CULTURA', image: 'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=1200&q=80' },
        { title: 'Cinema e realidade digital se misturam', text: 'Novos formatos de criação ampliam a criatividade e conectam histórias com experiências imersivas.', tag: 'CULTURA', image: 'https://images.unsplash.com/photo-1513106580091-1d82408b8cd6?auto=format&fit=crop&w=1200&q=80' }
      ],
      health: [
        { title: 'Sono e memória estão diretamente ligados', text: 'Quando o descanso é melhor, a consolidação das lembranças e a criatividade também tendem a melhorar.', tag: 'SAÚDE', image: 'https://images.unsplash.com/photo-1516549656523-d0b794d4624b?auto=format&fit=crop&w=1200&q=80' },
        { title: 'Hábitos simples ajudam no bem-estar diário', text: 'Pequenas mudanças de rotina podem ter grande impacto em energia, foco e qualidade de vida.', tag: 'SAÚDE', image: 'https://images.unsplash.com/photo-1541534401786-2077eed87a74?auto=format&fit=crop&w=1200&q=80' },
        { title: 'Alimentação e inteligência emocional ganham espaço', text: 'Hábitos equilibrados e conexões sociais continuam sendo pilares importantes para a saúde geral.', tag: 'SAÚDE', image: 'https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&w=1200&q=80' }
      ],
      environment: [
        { title: 'Florestas urbanas ajudam a frear o calor', text: 'Árvores e áreas verdes reduzem temperatura, melhoram o ar e trazem mais conforto aos bairros.', tag: 'AMBIENTE', image: 'https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=1200&q=80' },
        { title: 'Cidades sustentáveis redefinem o espaço urbano', text: 'Mobilidade, energia e arquitetura ambiental criam metrópoles mais inteligentes e mais equilibradas.', tag: 'AMBIENTE', image: 'https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=1200&q=80' },
        { title: 'Recursos renováveis ganham escala real', text: 'Soluções mais acessíveis ajudam comunidades a reduzirem emissões e a aumentarem autonomia energética.', tag: 'AMBIENTE', image: 'https://images.unsplash.com/photo-1497440001374-f26997328c1b?auto=format&fit=crop&w=1200&q=80' }
      ]
    };

    let currentCategory = 'all';
    let page = 1;
    let isLoading = false;
    let hasMore = true;
    let allNews = [];

    const feedContainer = document.getElementById('feed-container');
    const categoryBar = document.getElementById('category-bar');
    const loader = document.getElementById('loader');

    function safeText(value, fallback = '') {
      if (value === null || value === undefined || value === 'None') return fallback;
      const trimmed = String(value).trim();
      return trimmed || fallback;
    }

    function safeUrl(value, fallback = '#') {
      const text = safeText(value, fallback);
      return /^https?:\/\//i.test(text) ? text : fallback;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function normalizeNewsItem(item) {
      if (!item || !item.title) return null;

      const category = Array.isArray(item.category) && item.category.length ? item.category[0] : safeText(item.category, 'Notícias');
      const slug = getCategorySlug(category);

      return {
        id: `${slug}-${Date.now()}-${Math.random()}`,
        title: safeText(item.title, 'Notícia relevante'),
        text: safeText(item.description || item.summary || 'Confira mais detalhes sobre esta novidade.', 'Confira mais detalhes sobre esta novidade.'),
        tag: String(category || 'NOTÍCIAS').toUpperCase(),
        category: slug,
        url: safeUrl(item.url || '#', '#'),
        image: safeUrl(item.image, DEFAULT_BG),
        author: safeText(item.author, 'Agência GlobalPulse'),
        published: item.published || new Date().toISOString()
      };
    }

    function getCategorySlug(value) {
      const text = safeText(value, '').toLowerCase();
      if (!text) return 'news';
      if (text.includes('hist')) return 'history';
      if (text.includes('ciên') || text.includes('cien') || text.includes('science')) return 'science';
      if (text.includes('tech') || text.includes('tecnologia') || text.includes('digital')) return 'tech';
      if (text.includes('saud')) return 'health';
      if (text.includes('amb') || text.includes('clima') || text.includes('eco')) return 'environment';
      if (text.includes('art') || text.includes('cultura') || text.includes('culture')) return 'culture';
      return 'news';
    }

    function renderCategoryBar() {
      categoryBar.innerHTML = '';
      categories.forEach((item) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `cat-btn rounded-full px-4 py-2 text-[11px] font-bold tracking-[0.08em] uppercase ${currentCategory === item.id ? 'active' : ''}`;
        btn.textContent = item.label;
        btn.addEventListener('click', () => {
          currentCategory = item.id;
          renderCategoryBar();
          renderFeed();
        });
        categoryBar.appendChild(btn);
      });
    }

    async function fetchCurrentsAPI(pageNumber) {
      const url = `https://api.currentsapi.services/v1/latest-news?language=pt&page_number=${pageNumber}&apiKey=${CURRENTS_API_KEY}`;
      const attempts = [
        () => fetch(url, { headers: { Accept: 'application/json' } }),
        () => fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`),
        () => fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`)
      ];

      for (const attempt of attempts) {
        try {
          const response = await attempt();
          if (!response || !response.ok) continue;

          let data = await response.text();
          if (!data) continue;

          try {
            data = JSON.parse(data);
          } catch {
            // fallback para allorigins/get
            if (data && data.includes('"news"')) {
              const parsed = JSON.parse(data);
              if (parsed && Array.isArray(parsed.news)) return parsed.news;
            }
          }

          if (data && data.news && Array.isArray(data.news)) return data.news;
          if (data && data.contents) {
            const parsed = JSON.parse(data.contents);
            if (parsed && Array.isArray(parsed.news)) return parsed.news;
          }
        } catch (error) {
          console.warn('Erro ao carregar notícias:', error);
        }
      }

      return [];
    }

    function getFallbackByCategory(cat) {
      if (cat === 'all') return fallbackDatabase.news;
      return fallbackDatabase[cat] || fallbackDatabase.news;
    }

    async function loadMoreCards() {
      if (isLoading || !hasMore) return;
      isLoading = true;
      loader.classList.remove('hidden');

      let fresh = [];

      if (currentCategory === 'all') {
        fresh = await fetchCurrentsAPI(page);
        if (fresh.length === 0 && page === 1) {
          fresh = fallbackDatabase.news;
        }
      } else {
        const fallback = getFallbackByCategory(currentCategory);
        fresh = fallback.slice(0, 3);
      }

      if (!fresh.length) {
        hasMore = false;
      } else {
        const normalized = fresh
          .map(normalizeNewsItem)
          .filter(Boolean);

        if (currentCategory === 'all') {
          allNews = page === 1 ? normalized : [...allNews, ...normalized];
          page += 1;
        } else {
          allNews = [...allNews, ...normalized];
        }
      }

      renderFeed();
      isLoading = false;
      loader.classList.add('hidden');
    }

    function renderFeed() {
      const filtered = allNews.filter((item) => {
        if (!item) return false;
        if (currentCategory === 'all') return true;
        return item.category === currentCategory;
      });

      if (!filtered.length) {
        feedContainer.innerHTML = `
          <div class="empty-state">
            <div>
              <i class="fa-solid fa-newspaper text-3xl text-gray-500 mb-3 block"></i>
              <p class="text-base font-semibold text-gray-300">Nenhuma novidade encontrada nesta categoria.</p>
            </div>
          </div>
        `;
        return;
      }

      feedContainer.innerHTML = filtered.map((card, index) => `
        <section class="card-snap" data-id="${card.id}" data-category="${card.category}">
          <img class="card-bg" src="${escapeHtml(card.image)}" alt="${escapeHtml(card.title)}" onerror="this.src='${DEFAULT_BG}'" />
          <div class="card-overlay"></div>

          <div class="absolute right-4 bottom-24 z-20 flex flex-col items-center gap-5">
            <button type="button" class="action-btn like-btn" data-like-id="${card.id}" aria-label="Curtir notícia">
              <i class="fa-solid fa-heart text-lg"></i>
            </button>

            <button type="button" class="action-btn save-btn" data-save-id="${card.id}" aria-label="Salvar notícia">
              <i class="fa-solid fa-bookmark text-lg"></i>
            </button>

            <a href="${card.url}" target="_blank" rel="noopener noreferrer" class="action-btn" aria-label="Ler matéria">
              <i class="fa-solid fa-arrow-up-right-from-square text-lg"></i>
            </a>
          </div>

          <div class="relative z-10 w-full max-w-md mx-auto mb-2">
            <div class="mb-3 inline-block rounded-full border border-red-400/40 bg-red-500/20 px-3 py-1 text-[10px] font-bold uppercase tracking-[0.2em] text-red-200">
              ${escapeHtml(card.tag)}
            </div>

            <h2 class="text-shadow text-2xl font-black leading-tight text-white mb-2">${escapeHtml(card.title)}</h2>
            <p class="text-shadow text-sm leading-relaxed text-gray-200">${escapeHtml(card.text)}</p>

            <div class="mt-4 flex items-center justify-between gap-3 text-[11px] text-gray-300">
              <span>${escapeHtml(card.author)}</span>
              <span>${new Date(card.published).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' })}</span>
            </div>
          </div>
        </section>
      `).join('');

      bindCardEvents();
      attachInfiniteScroll();
    }

    function bindCardEvents() {
      document.querySelectorAll('.like-btn').forEach((button) => {
        button.addEventListener('click', () => {
          const icon = button.querySelector('i');
          button.classList.toggle('active');
          icon.classList.toggle('text-red-400');
          icon.classList.toggle('text-white');
        });
      });

      document.querySelectorAll('.save-btn').forEach((button) => {
        button.addEventListener('click', () => {
          const icon = button.querySelector('i');
          button.classList.toggle('active');
          icon.classList.toggle('text-yellow-400');
          icon.classList.toggle('text-white');
        });
      });
    }

    function attachInfiniteScroll() {
      const cards = [...document.querySelectorAll('.card-snap')];
      if (!cards.length) return;

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting && !isLoading && hasMore) {
            const lastCard = cards[cards.length - 1];
            if (lastCard && entry.target === lastCard) {
              loadMoreCards();
            }
          }
        });
      }, { root: feedContainer, rootMargin: '0px', threshold: 0.75 });

      cards.forEach((card) => observer.observe(card));
    }

    function init() {
      renderCategoryBar();
      loadMoreCards();
      feedContainer.addEventListener('scroll', () => {
        if (feedContainer.scrollTop + feedContainer.clientHeight >= feedContainer.scrollHeight - 200) {
          loadMoreCards();
        }
      });
    }

    init();
  </script>
</body>
</html>
